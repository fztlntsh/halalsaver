<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d7a4f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HalalSaver MY" />

  <title>Register — HalalSaver MY</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #edf7f1 0%, #f5fbf7 40%, #e8f5e9 100%);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;      /* vertically center on tall viewports */
      justify-content: center;
      padding: 1.2rem 1rem;     /* tight padding — keeps form within 100vh on desktop */
    }

    .reg-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(45,122,79,.18);
      padding: 1.6rem 2rem;     /* reduced top/bottom padding */
      width: 100%;
      max-width: 480px;
      border: 1px solid rgba(255,255,255,.8);
    }

    /* Logo */
    .reg-logo {
      display: flex;
      justify-content: center;
      margin-bottom: .6rem;     /* was 1rem */
    }

    /* Header */
    .reg-header {
      text-align: center;
      margin-bottom: .9rem;     /* was 1.4rem */
    }
    .reg-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a2e22;
      margin-bottom: .2rem;
    }
    .reg-header p {
      font-size: .8rem;
      color: #7a9a84;
      margin: 0;
    }

    /* Input fields */
    .field {
      position: relative;
      margin-bottom: .55rem;    /* was .7rem */
    }
    .field i.icon {
      position: absolute;
      left: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ab8a4;
      font-size: .82rem;
      pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: .65rem .85rem .65rem 2.3rem;
      border: 1.5px solid #d5e8db;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: .83rem;
      color: #1a2e22;
      background: #f9fdf9;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      border-color: #2d7a4f;
      box-shadow: 0 0 0 3px rgba(45,122,79,.1);
      background: #fff;
    }
    .field input::placeholder { color: #9ab8a4; }
    .toggle-eye {
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ab8a4;
      cursor: pointer;
      font-size: .82rem;
    }

    /* Two column row */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
    }

    /* Strength bar */
    .strength-wrap {
      margin: -.4rem 0 .6rem;
    }
    .strength-bar {
      height: 4px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width .3s, background .3s;
    }
    .strength-label {
      font-size: .68rem;
      color: #9ab8a4;
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    /* Terms */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: .5rem;
      margin-bottom: .9rem;
      font-size: .75rem;
      color: #3d5c48;
    }
    .terms-row input[type="checkbox"] {
      margin-top: 2px;
      accent-color: #2d7a4f;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
    }
    .terms-row a { color: #2d7a4f; font-weight: 600; }

    /* Register button */
    .btn-register {
      width: 100%;
      padding: .75rem;
      background: #2d7a4f;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: background .2s, transform .1s;
      margin-bottom: .8rem;
    }
    .btn-register:hover { background: #235f3c; }
    .btn-register:active { transform: scale(.98); }
    .btn-register:disabled { background: #9ab8a4; cursor: not-allowed; }

    /* Divider */
    .divider {
      text-align: center;
      font-size: .72rem;
      color: #9ab8a4;
      margin: .5rem 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: #d5e8db;
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    /* Guest button */
    .btn-guest {
      width: 100%;
      padding: .6rem;
      background: transparent;
      border: 1.5px solid #d5e8db;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: .82rem;
      color: #3d5c48;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: background .2s, border-color .2s;
      margin-bottom: .7rem;
    }
    .btn-guest:hover { background: #edf7f1; border-color: #2d7a4f; }

    /* Footer link */
    .footer-link {
      text-align: center;
      font-size: .78rem;
      color: #7a9a84;
    }
    .footer-link a { color: #2d7a4f; font-weight: 600; }

    @media (max-width: 480px) {
      .reg-card { padding: 1.5rem 1.2rem; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="reg-card">

    <!-- Logo -->
    <div class="reg-logo" id="logo-placeholder"></div>

    <!-- Header -->
    <div class="reg-header">
      <h1><i class="fas fa-user-plus" style="color:#2d7a4f; margin-right:.4rem;"></i>Create your account</h1>
      <p>Join Malaysians shopping smarter &amp; halal-certified</p>
    </div>

    <!-- Form -->
    <form id="registerForm" novalidate autocomplete="off">

      <!-- Name + Phone (side by side) -->
      <div class="field-row">
        <div class="field">
          <i class="fas fa-user icon"></i>
          <input type="text" id="name" placeholder="Full name" required />
        </div>
        <div class="field">
          <i class="fas fa-phone icon"></i>
          <input type="tel" id="phone" placeholder="Phone (optional)" />
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <i class="fas fa-envelope icon"></i>
        <input type="email" id="email" placeholder="Email address" required />
      </div>

      <!-- Password + Confirm (side by side) -->
      <div class="field-row">
        <div class="field">
          <i class="fas fa-lock icon"></i>
          <input type="password" id="password" placeholder="Password" required />
          <i class="fas fa-eye toggle-eye toggle-pass"></i>
        </div>
        <div class="field">
          <i class="fas fa-shield-halved icon"></i>
          <input type="password" id="confirmPass" placeholder="Confirm password" required />
          <i class="fas fa-eye toggle-eye toggle-pass"></i>
        </div>
      </div>

      <!-- Password strength -->
      <div class="strength-wrap">
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-label">
          <span>Password strength</span>
          <span id="strengthLabel"></span>
        </div>
      </div>

      <!-- Budget -->
      <div class="field">
        <i class="fas fa-wallet icon"></i>
        <input type="number" id="budget" placeholder="Monthly grocery budget (RM)" min="0" step="10" />
      </div>

      <!-- Terms -->
      <div class="terms-row">
        <input type="checkbox" id="termsCheck" />
        <label for="termsCheck">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <!-- Register Button -->
      <button type="submit" class="btn-register" id="registerBtn">
        <i class="fas fa-user-plus"></i> Create Free Account
      </button>

    </form>

    <div class="divider">or</div>

    <!-- Guest -->
    <button type="button" class="btn-guest"
            onclick="sessionStorage.setItem('hs_guest','true'); window.location.href='products.html';">
      <i class="fas fa-user-clock"></i> Continue as Guest
    </button>

    <!-- Login link -->
    <div class="footer-link">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>

  </div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/main.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .catch(err => console.warn("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
