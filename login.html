<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d7a4f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HalalSaver MY" />

  <title>Login — HalalSaver MY | Grocery Recommender</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ── Spacing overrides: keep everything inside 100vh, no scroll on desktop ── */
    .auth-card .auth-logo    { margin-bottom: .8rem; }
    .auth-card .auth-header  { margin-bottom: .9rem; }
    .auth-card .auth-title   { font-size: 1.3rem; margin-bottom: .15rem; }
    .auth-card .auth-subtitle{ font-size: .78rem; }
    .input-group-custom      { margin-bottom: .6rem; }
    .remember-row            { margin-bottom: .7rem; }
    .auth-divider            { margin: .6rem 0; }
    .auth-footer-link        { margin-top: .7rem; }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      padding: .55rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-mid);
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      margin-bottom: .4rem;
    }
    .social-btn:hover { background: var(--primary-50); border-color: var(--primary-100); }

    .features-strip {
      display: flex;
      gap: .4rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .7rem;
    }
    .feature-pill {
      display: flex;
      align-items: center;
      gap: .3rem;
      background: rgba(45,122,79,.08);
      color: var(--primary);
      padding: .22rem .65rem;
      border-radius: 20px;
      font-size: .68rem;
      font-weight: 500;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo (injected by JS) -->
      <div class="auth-logo" id="logo-placeholder"></div>

      <!-- Header -->
      <div class="auth-header">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to get your personalised halal grocery picks</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate autocomplete="off">

        <!-- Email -->
        <div class="input-group-custom">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-control-custom"
                 placeholder="Email address" autocomplete="email" required />
        </div>

        <!-- Password -->
        <div class="input-group-custom">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="pass" class="form-control-custom"
                 placeholder="Password" autocomplete="current-password" required />
          <i class="fas fa-eye toggle-pass"></i>
        </div>

        <!-- Remember / Forgot -->
        <div class="remember-row">
          <label class="custom-checkbox">
            <input type="checkbox" id="rememberMe" />
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary-custom">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>

      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or continue with</span></div>

      <!-- Social Buttons -->
      <button class="social-btn">
        <!-- Google SVG icon inline -->
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Guest access -->
      <div style="text-align:center; margin:.3rem 0 0;">
        <button type="button" class="btn-guest-access"
                onclick="sessionStorage.setItem('hs_guest','true'); window.location.href='products.html';">
          <i class="fas fa-user-clock"></i> Continue as Guest
        </button>
      </div>

      <!-- Register link -->
      <div class="auth-footer-link">
        Don't have an account? <a href="register.html">Create one free</a>
      </div>

      <!-- Feature pills -->
      <div class="features-strip">
        <div class="feature-pill"><i class="fas fa-leaf"></i> Halal Certified</div>
        <div class="feature-pill"><i class="fas fa-wallet"></i> Budget Smart</div>
        <div class="feature-pill"><i class="fas fa-robot"></i> AI Powered</div>
      </div>

    </div><!-- /.auth-card -->
  </div><!-- /.auth-wrapper -->

  <!-- Footer (injected by JS) -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(err => console.warn("SW registration failed:", err));
      });
    }
  </script>
</body>
</html>
